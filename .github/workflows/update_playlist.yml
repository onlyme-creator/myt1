# .github/workflows/update_playlist.yml
#
# Runs update_playlist.py on a schedule (and on push to main).
# In cloud mode the script skips all network pings to avoid false-dead
# channel removals from blocked datacenter IPs.
#
# Files committed back to the repo every run:
#   playlist.m3u       — unchanged by cloud runner (protected)
#   dead_channels.txt  — unchanged by cloud runner (protected)
#   health_report.txt  — updated with "cloud mode / pings skipped" note
#
# Files NEVER touched by this workflow:
#   shrunk_epg.xml     — built only by local rebuild_epg.py on your home PC
#   plex_us_epg.xml    — source file, never modified

name: Update IPTV Playlist

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  update-playlist:
    name: Playlist Health Check (Cloud Mode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run playlist manager (cloud/skip-ping mode)
        run: python update_playlist.py --cloud

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u dead_channels.txt health_report.txt

          if git diff --cached --quiet; then
            echo "No changes to commit — repository is already up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: cloud health check [${TIMESTAMP}]"
            git push
          fi

      - name: Manage dead-channel GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEAD_COUNT=$(grep -c '^\[DEAD\]' dead_channels.txt 2>/dev/null || echo 0)
          ISSUE_TITLE="Warning Dead channels detected in playlist"

          EXISTING=$(gh issue list \
            --state open \
            --search "$ISSUE_TITLE" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ "$DEAD_COUNT" -gt "0" ]; then
            BODY=$(printf \
              "## Dead Channels\n\nThe playlist contains **%s dead channel(s)**.\n\n### Dead channel list\n\`\`\`\n%s\n\`\`\`\n\n> Auto-generated by GitHub Actions." \
              "$DEAD_COUNT" \
              "$(grep '^\[DEAD\]' dead_channels.txt 2>/dev/null | head -50 || echo 'See dead_channels.txt')")

            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY" 2>/dev/null || true
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "All channels are back online. Closing automatically."
            fi
          fi
