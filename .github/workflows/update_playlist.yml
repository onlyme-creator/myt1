name: Update Playlist and Stream Health

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every single night at midnight
  workflow_dispatch: # Allows you to click the manual "Run workflow" button anytime

jobs:
  update-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.x'

    - name: Execute Stream Health Engine
      run: python update_playlist.py

    - name: Deploy Health Verification Updates back to GitHub
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add playlist.m3u dead_channels.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated stream monitoring sync" && git push)
