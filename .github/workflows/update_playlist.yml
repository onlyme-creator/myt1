# .github/workflows/update_playlist.yml
#
# Runs update_playlist.py on a schedule (and on push to main).
# In cloud mode the script skips all network pings to avoid false-dead
# channel removals from blocked datacenter IPs.
#
# Files committed back to the repo every run:
#   playlist.m3u       — unchanged by cloud runner (protected)
#   dead_channels.txt  — unchanged by cloud runner (protected)
#   health_report.txt  — updated with "cloud mode / pings skipped" note
#
# Files NEVER touched by this workflow:
#   shrunk_epg.xml     — built only by local_shrink.py on your home PC
#   plex_us_epg.xml    — source file, never modified
#
# ── One-time setup checklist ───────────────────────────────────────────────
#  1. Repo Settings → Actions → General → Workflow permissions:
#       ✅  "Read and write permissions"   (required for the git push step)
#  2. Default branch must be "main" (or change the refs below to match).
#  3. Commit requirements.txt to the repo root containing:
#       requests
#     (lxml is NOT needed here — XML work is local-only)
# ──────────────────────────────────────────────────────────────────────────

name: Update IPTV Playlist

on:
  # Trigger on every push to main (handy for testing)
  push:
    branches:
      - main

  # Run automatically once per day at 06:00 UTC (02:00 Eastern)
  schedule:
    - cron: "0 6 * * *"

  # Allow manual trigger from the Actions tab → "Run workflow"
  workflow_dispatch:

jobs:
  update-playlist:
    name: Playlist Health Check (Cloud Mode)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the full repository ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for the push step

      # ── 2. Set up Python ────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Cache pip to speed up repeated runs ──────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install Python dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements.txt if it exists, otherwise just requests
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # ── 5. Run the playlist manager in cloud mode ────────────────────────
      #
      # The script auto-detects the cloud environment and skips all pings.
      # It will NOT modify playlist.m3u or shrunk_epg.xml.
      - name: Run playlist manager (cloud/skip-ping mode)
        run: python update_playlist.py --cloud

      # ── 6. Commit only the safe files ───────────────────────────────────
      #
      # We stage only the files this script is allowed to update.
      # shrunk_epg.xml and plex_us_epg.xml are intentionally NOT staged here.
      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files the cloud runner is permitted to touch
          git add playlist.m3u dead_channels.txt health_report.txt

          if git diff --cached --quiet; then
            echo "No changes to commit — repository is already up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: cloud health check [${TIMESTAMP}]"
            git push
          fi

      # ── 7. (Optional) Open / close a GitHub Issue for dead channels ──────
      #
      # Since cloud mode never marks channels dead, this step mostly closes
      # any stale issues.  It is safe to remove this step if you don't use
      # GitHub Issues for monitoring.
      - name: Manage dead-channel GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count entries in dead_channels.txt  (lines that start with [DEAD])
          DEAD_COUNT=$(grep -c '^\[DEAD\]' dead_channels.txt 2>/dev/null || echo 0)
          ISSUE_TITLE="Warning Dead channels detected in playlist"

          # Find any existing open issue with this title
          EXISTING=$(gh issue list \
            --state open \
            --search "$ISSUE_TITLE" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ "$DEAD_COUNT" -gt "0" ]; then
            BODY=$(printf \
              "## Dead Channels\n\nThe playlist contains **%s dead channel(s)**.\nThey were identified by a *home-mode* run and will be restored automatically when they come back online.\n\n### Dead channel list\n\`\`\`\n%s\n\`\`\`\n\n> Auto-generated by GitHub Actions. Closes when all channels recover." \
              "$DEAD_COUNT" \
              "$(grep '^\[DEAD\]' dead_channels.txt 2>/dev/null | head -50 || echo 'See dead_channels.txt')")

            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "Updated existing issue #$EXISTING"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY" 2>/dev/null || true
              echo "Opened new dead-channel issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "All channels are back online. Closing automatically."
              echo "Closed issue #$EXISTING — all channels alive"
            else
              echo "All channels alive — no issue to manage."
            fi
          fi
